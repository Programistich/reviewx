name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to release, e.g. 1.0.0 (tags v1.0.0 and moves v1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @reviewx/action test -- --run
      - name: Bump version and rebuild dist
        run: |
          cd action && npm pkg set version="${{ inputs.version }}" && cd ..
          pnpm --filter @reviewx/action build
      - name: Commit, tag and move the major tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add action/package.json dist
          git diff --cached --quiet || git commit -m "Release v${{ inputs.version }}"
          git tag -f "v${{ inputs.version }}"
          major="v$(echo '${{ inputs.version }}' | cut -d. -f1)"
          git tag -f "$major"
          git push origin HEAD:main
          git push -f origin "v${{ inputs.version }}" "$major"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" --generate-notes --title "v${{ inputs.version }}"
