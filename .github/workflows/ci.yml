name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @reviewx/action test -- --run
      - run: pnpm --filter @reviewx/server test
      - name: dist/ is built from the current sources
        run: |
          pnpm --filter @reviewx/action build
          git diff --exit-code --stat dist/ || {
            echo "::error::dist/ is stale — run 'pnpm --filter @reviewx/action build' and commit the result"
            exit 1
          }
