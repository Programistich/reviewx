# Joins the host's shared Caddy network; the Caddy on the VPS terminates TLS
# and proxies reviewx.programistich.com → reviewx-server:3000 (see Caddyfile.snippet).
services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: reviewx-server
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    networks:
      - shared-proxy

networks:
  shared-proxy:
    external: true
